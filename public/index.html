<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scramjet Demo</title>

		<link
			rel="preload"
			href="/scramjet/scramjet.wasm"
			as="fetch"
			type="application/wasm"
			crossorigin
		/>
		<link rel="preload" href="/scramjet/scramjet.js" as="script" />
		<link rel="preload" href="/controller/controller.api.js" as="script" />
		<link rel="preload" href="/controller/controller.sw.js" as="script" />

		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script type="module" crossorigin src="/assets/index-DnINZY03.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/index-cUh8D1R6.css">

		<style>
			#scramjet-movies-panel {
				position: absolute;
				top: 29px;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 20;
				display: none;
				min-width: 0;
				min-height: 0;
				padding: 16px;
				background: #0f0f0f;
				color: #e5e7eb;
				overflow: auto;
				box-sizing: border-box;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			#scramjet-movies-panel.active {
				display: block;
			}
			#scramjet-movies-panel .movies-header {
				margin-bottom: 16px;
				padding-bottom: 12px;
				border-bottom: 1px solid #222;
			}
			#scramjet-movies-panel .movies-header h2 {
				margin: 0 0 6px;
				font-size: 1rem;
				font-weight: 600;
			}
			#scramjet-movies-panel .movies-header p,
			#scramjet-movies-panel .movies-empty {
				margin: 0;
				color: #a8a8a8;
				line-height: 1.45;
				font-size: 0.84rem;
			}
		</style>
	</head>

	<body class="light-mode">
		<div id="app"></div>

		<script>
			(() => {
				let installed = false;

				function installMoviesTab() {
					if (installed) return true;

					const browserButton = Array.from(
						document.querySelectorAll(".tab-button")
					).find((button) => button.textContent.trim() === "Browser");

					if (!browserButton) return false;

					installed = true;

					const moviesButton = document.createElement("button");
					moviesButton.type = "button";
					moviesButton.className = "tab-button";
					moviesButton.textContent = "Movies";
					moviesButton.dataset.scramjetMovies = "true";

					const panel = document.createElement("div");
					panel.id = "scramjet-movies-panel";
					panel.innerHTML =
						'<div class="movies-header"><h2>Movies</h2><p>Browse and watch movies from this tab.</p></div><div class="movies-empty">Movie library coming soon.</div>';

					browserButton.insertAdjacentElement("afterend", moviesButton);
					document.body.appendChild(panel);

					const originalButtons = Array.from(
						document.querySelectorAll(".tab-button")
					).filter((button) => button !== moviesButton);

					const closeMovies = () => {
						panel.classList.remove("active");
						moviesButton.classList.remove("active");
					};

					for (const button of originalButtons) {
						button.addEventListener("click", closeMovies, true);
					}

					moviesButton.addEventListener("click", () => {
						for (const button of originalButtons) {
							button.classList.remove("active");
						}
						moviesButton.classList.add("active");
						panel.classList.add("active");
					});

					return true;
				}

				if (!installMoviesTab()) {
					const observer = new MutationObserver(() => {
						if (installMoviesTab()) observer.disconnect();
					});
					observer.observe(document.documentElement, {
						childList: true,
						subtree: true,
					});
				}
			})();
		</script>
	</body>
</html>
