<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scramjet Demo</title>

		<link
			rel="preload"
			href="/scramjet/scramjet.wasm"
			as="fetch"
			type="application/wasm"
			crossorigin
		/>
		<link rel="preload" href="/scramjet/scramjet.js" as="script" />
		<link rel="preload" href="/controller/controller.api.js" as="script" />
		<link rel="preload" href="/controller/controller.sw.js" as="script" />

		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script type="module" crossorigin src="/assets/index-DnINZY03.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/index-cUh8D1R6.css">

		<style>
			#scramjet-movies-panel {
				position: absolute;
				top: 29px;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 20;
				display: none;
				min-width: 0;
				min-height: 0;
				padding: 16px;
				background: #0f0f0f;
				color: #e5e7eb;
				overflow: auto;
				box-sizing: border-box;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}

			#scramjet-movies-panel.active {
				display: block;
			}

			#scramjet-movies-panel * {
				box-sizing: border-box;
			}

			.movies-header {
				display: flex;
				align-items: flex-end;
				justify-content: space-between;
				gap: 12px;
				margin-bottom: 14px;
				padding-bottom: 12px;
				border-bottom: 1px solid #222;
			}

			.movies-title h2 {
				margin: 0 0 5px;
				font-size: 1rem;
				font-weight: 600;
			}

			.movies-title p {
				margin: 0;
				color: #a8a8a8;
				font-size: 0.8rem;
			}

			.movies-search {
				display: flex;
				align-items: stretch;
				width: min(520px, 100%);
				height: 31px;
			}

			.movies-search input {
				flex: 1;
				min-width: 0;
				padding: 0 9px;
				border: 1px solid #2a2a2a;
				border-right: 0;
				border-radius: 0;
				outline: none;
				background: #111;
				color: #e5e7eb;
				font: inherit;
				font-size: 0.8rem;
			}

			.movies-search input:focus {
				border-color: #4a4a4a;
			}

			.movies-search button,
			.movies-tabs button,
			.movies-back {
				border: 1px solid #2a2a2a;
				border-radius: 0;
				background: #1a1a1a;
				color: #e5e7eb;
				cursor: pointer;
				font: inherit;
				font-size: 0.78rem;
				line-height: 1.2;
				min-height: 28px;
			}

			.movies-search button {
				padding: 0 11px;
			}

			.movies-search button:hover,
			.movies-tabs button:hover,
			.movies-back:hover {
				background: #222;
			}

			.movies-tabs {
				display: flex;
				gap: 6px;
				margin-bottom: 14px;
			}

			.movies-tabs button {
				padding: 0.4em 0.7em;
			}

			.movies-tabs button.active {
				border-color: #4a4a4a;
				background: #1f1f1f;
				color: #fff;
			}

			.movies-state {
				display: none;
				padding: 14px 0;
				color: #8f8f8f;
				font-size: 0.82rem;
			}

			.movies-state.visible {
				display: block;
			}

			.movies-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
				gap: 10px;
			}

			.movie-item {
				min-width: 0;
				border: 1px solid #262626;
				border-radius: 6px;
				background: #101010;
				overflow: hidden;
				cursor: pointer;
				transition:
					border-color 0.15s ease,
					background 0.15s ease;
			}

			.movie-item:hover {
				border-color: #3a3a3a;
				background: #141414;
			}

			.movie-poster-wrap {
				position: relative;
				width: 100%;
				aspect-ratio: 2 / 3;
				background: #0b0b0b;
				border-bottom: 1px solid #222;
				overflow: hidden;
			}

			.movie-poster {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: cover;
			}

			.movie-poster-fallback {
				width: 100%;
				height: 100%;
				display: grid;
				place-items: center;
				padding: 12px;
				color: #666;
				font-size: 0.72rem;
				text-align: center;
			}

			.movie-type {
				position: absolute;
				left: 6px;
				bottom: 6px;
				padding: 2px 5px;
				border: 1px solid #333;
				background: rgba(15, 15, 15, 0.92);
				color: #cfcfcf;
				font-size: 0.62rem;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}

			.movie-info {
				padding: 9px;
			}

			.movie-name {
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				font-size: 0.8rem;
				font-weight: 600;
				color: #f2f2f2;
			}

			.movie-meta {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin-top: 5px;
				color: #8f8f8f;
				font-size: 0.7rem;
			}

			.movie-rating {
				color: #c7c7c7;
			}

			.movies-detail {
				display: none;
			}

			.movies-detail.visible {
				display: block;
			}

			.movies-catalog.hidden {
				display: none;
			}

			.movies-detail-toolbar {
				margin-bottom: 12px;
			}

			.movies-back {
				padding: 0.42em 0.72em;
			}

			.movies-detail-layout {
				display: grid;
				grid-template-columns: 180px minmax(0, 720px);
				gap: 18px;
				align-items: start;
			}

			.movies-detail-poster {
				width: 100%;
				aspect-ratio: 2 / 3;
				object-fit: cover;
				border: 1px solid #262626;
				background: #0b0b0b;
			}

			.movies-detail-body h2 {
				margin: 0 0 8px;
				font-size: 1.15rem;
				font-weight: 600;
			}

			.movies-detail-meta {
				display: flex;
				flex-wrap: wrap;
				gap: 7px 12px;
				margin-bottom: 14px;
				color: #9ca3af;
				font-size: 0.78rem;
			}

			.movies-detail-body p {
				margin: 0;
				color: #c7c7c7;
				line-height: 1.55;
				font-size: 0.84rem;
			}

			.tmdb-credit {
				margin-top: 18px;
				padding-top: 12px;
				border-top: 1px solid #222;
				color: #777;
				font-size: 0.68rem;
				line-height: 1.45;
			}

			@media (max-width: 720px) {
				.movies-header {
					align-items: stretch;
					flex-direction: column;
				}

				.movies-search {
					width: 100%;
				}

				.movies-grid {
					grid-template-columns: repeat(3, minmax(0, 1fr));
				}

				.movies-detail-layout {
					grid-template-columns: 120px minmax(0, 1fr);
					gap: 12px;
				}
			}

			@media (max-width: 480px) {
				#scramjet-movies-panel {
					padding: 12px;
				}

				.movies-grid {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}

				.movies-detail-layout {
					grid-template-columns: 1fr;
				}

				.movies-detail-poster {
					width: 145px;
				}
			}
		</style>
	</head>

	<body class="light-mode">
		<div id="app"></div>

		<script>
			(() => {
				const TMDB_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlMWVmNjUwNjI1OTUyYzBkMjAzNThlYzUwYjQ4MjY5NiIsIm5iZiI6MTc3OTUwMDA3OS4zODIwMDAyLCJzdWIiOiI2YTExMDQyZjFiZTVlMDcyNTE2YjU3NmUiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.G2S8E4lZ8xdk1GJzkknjh_Z0DaHgaUKmk7kEUe0oCEU";
				const TMDB_API = "https://api.themoviedb.org/3";
				const TMDB_IMAGE = "https://image.tmdb.org/t/p/w500";
				let installed = false;
				let loaded = false;
				let currentMode = "trending";

				function yearOf(item) {
					const date = item.release_date || item.first_air_date || "";
					return date ? date.slice(0, 4) : "—";
				}

				function mediaTypeOf(item, fallback) {
					if (item.media_type === "movie" || item.media_type === "tv") {
						return item.media_type;
					}
					return fallback || "movie";
				}

				function titleOf(item) {
					return item.title || item.name || item.original_title || item.original_name || "Untitled";
				}

				async function tmdb(path) {
					const response = await fetch(TMDB_API + path, {
						headers: {
							accept: "application/json",
							Authorization: "Bearer " + TMDB_TOKEN,
						},
					});

					if (!response.ok) {
						throw new Error("TMDB request failed (" + response.status + ")");
					}

					return response.json();
				}

				function installMoviesTab() {
					if (installed) return true;

					const browserButton = Array.from(
						document.querySelectorAll(".tab-button")
					).find((button) => button.textContent.trim() === "Browser");

					if (!browserButton) return false;

					installed = true;

					const moviesButton = document.createElement("button");
					moviesButton.type = "button";
					moviesButton.className = "tab-button";
					moviesButton.textContent = "Movies";
					moviesButton.dataset.scramjetMovies = "true";

					const panel = document.createElement("div");
					panel.id = "scramjet-movies-panel";
					panel.innerHTML = `
						<div class="movies-catalog" id="movies-catalog">
							<div class="movies-header">
								<div class="movies-title">
									<h2>Movies & Shows</h2>
									<p>Browse the TMDB catalog.</p>
								</div>
								<form class="movies-search" id="movies-search">
									<input id="movies-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search movies and TV shows" />
									<button type="submit">Search</button>
								</form>
							</div>
							<div class="movies-tabs">
								<button type="button" class="active" data-movie-mode="trending">Trending</button>
								<button type="button" data-movie-mode="movies">Movies</button>
								<button type="button" data-movie-mode="tv">TV Shows</button>
							</div>
							<div class="movies-state" id="movies-state"></div>
							<div class="movies-grid" id="movies-grid"></div>
							<div class="tmdb-credit">This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
						</div>
						<div class="movies-detail" id="movies-detail">
							<div class="movies-detail-toolbar">
								<button type="button" class="movies-back" id="movies-back">← Back</button>
							</div>
							<div class="movies-state" id="movies-detail-state"></div>
							<div class="movies-detail-layout" id="movies-detail-layout"></div>
							<div class="tmdb-credit">This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
						</div>
					`;

					browserButton.insertAdjacentElement("afterend", moviesButton);
					document.body.appendChild(panel);

					const catalog = panel.querySelector("#movies-catalog");
					const detail = panel.querySelector("#movies-detail");
					const detailLayout = panel.querySelector("#movies-detail-layout");
					const detailState = panel.querySelector("#movies-detail-state");
					const grid = panel.querySelector("#movies-grid");
					const state = panel.querySelector("#movies-state");
					const searchForm = panel.querySelector("#movies-search");
					const searchInput = panel.querySelector("#movies-search-input");
					const tabs = Array.from(panel.querySelectorAll("[data-movie-mode]"));

					function setState(message) {
						state.textContent = message || "";
						state.classList.toggle("visible", !!message);
					}

					function setDetailState(message) {
						detailState.textContent = message || "";
						detailState.classList.toggle("visible", !!message);
					}

					function setMode(mode) {
						currentMode = mode;
						tabs.forEach((button) => {
							button.classList.toggle("active", button.dataset.movieMode === mode);
						});
					}

					function renderItems(items, fallbackType) {
						grid.innerHTML = "";

						const filtered = items.filter((item) => {
							const type = mediaTypeOf(item, fallbackType);
							return type === "movie" || type === "tv";
						});

						if (!filtered.length) {
							setState("No titles found.");
							return;
						}

						setState("");

						for (const item of filtered) {
							const type = mediaTypeOf(item, fallbackType);
							const card = document.createElement("article");
							card.className = "movie-item";
							card.tabIndex = 0;

							const poster = item.poster_path
								? `<img class="movie-poster" loading="lazy" src="${TMDB_IMAGE}${item.poster_path}" alt="">`
								: `<div class="movie-poster-fallback">No poster available</div>`;

							card.innerHTML = `
								<div class="movie-poster-wrap">
									${poster}
									<span class="movie-type">${type === "tv" ? "TV" : "Movie"}</span>
								</div>
								<div class="movie-info">
									<div class="movie-name" title="${titleOf(item).replaceAll('"', "&quot;")}">${titleOf(item)}</div>
									<div class="movie-meta">
										<span>${yearOf(item)}</span>
										<span class="movie-rating">★ ${Number(item.vote_average || 0).toFixed(1)}</span>
									</div>
								</div>
							`;

							const open = () => openDetail(type, item.id);
							card.addEventListener("click", open);
							card.addEventListener("keydown", (event) => {
								if (event.key === "Enter" || event.key === " ") {
									event.preventDefault();
									open();
								}
							});
							grid.appendChild(card);
						}
					}

					async function loadMode(mode) {
						setMode(mode);
						grid.innerHTML = "";
						setState("Loading catalog…");

						try {
							if (mode === "trending") {
								const data = await tmdb("/trending/all/week?language=en-US");
								renderItems(data.results || []);
							} else if (mode === "movies") {
								const data = await tmdb("/movie/popular?language=en-US&page=1");
								renderItems(data.results || [], "movie");
							} else {
								const data = await tmdb("/tv/popular?language=en-US&page=1");
								renderItems(data.results || [], "tv");
							}
						} catch (error) {
							setState(error instanceof Error ? error.message : "Failed to load TMDB catalog.");
						}
					}

					async function search(query) {
						const value = query.trim();
						if (!value) {
							await loadMode(currentMode);
							return;
						}

						tabs.forEach((button) => button.classList.remove("active"));
						grid.innerHTML = "";
						setState("Searching…");

						try {
							const data = await tmdb(
								"/search/multi?include_adult=false&language=en-US&page=1&query=" +
									encodeURIComponent(value)
							);
							renderItems(data.results || []);
						} catch (error) {
							setState(error instanceof Error ? error.message : "Search failed.");
						}
					}

					async function openDetail(type, id) {
						catalog.classList.add("hidden");
						detail.classList.add("visible");
						detailLayout.innerHTML = "";
						setDetailState("Loading details…");

						try {
							const item = await tmdb(
								"/" + type + "/" + id + "?language=en-US"
							);
							setDetailState("");

							const poster = item.poster_path
								? `<img class="movies-detail-poster" src="${TMDB_IMAGE}${item.poster_path}" alt="">`
								: `<div class="movies-detail-poster"></div>`;

							const runtime =
								type === "movie" && item.runtime
									? item.runtime + " min"
									: type === "tv" && item.number_of_seasons
										? item.number_of_seasons + (item.number_of_seasons === 1 ? " season" : " seasons")
										: "";

							const genres = Array.isArray(item.genres)
								? item.genres.map((genre) => genre.name).join(", ")
								: "";

							detailLayout.innerHTML = `
								<div>${poster}</div>
								<div class="movies-detail-body">
									<h2>${titleOf(item)}</h2>
									<div class="movies-detail-meta">
										<span>${type === "tv" ? "TV Show" : "Movie"}</span>
										<span>${yearOf(item)}</span>
										<span>★ ${Number(item.vote_average || 0).toFixed(1)}</span>
										${runtime ? `<span>${runtime}</span>` : ""}
										${genres ? `<span>${genres}</span>` : ""}
									</div>
									<p>${item.overview || "No overview is available for this title."}</p>
								</div>
							`;
						} catch (error) {
							setDetailState(error instanceof Error ? error.message : "Failed to load details.");
						}
					}

					panel.querySelector("#movies-back").addEventListener("click", () => {
						detail.classList.remove("visible");
						catalog.classList.remove("hidden");
					});

					tabs.forEach((button) => {
						button.addEventListener("click", () => {
							searchInput.value = "";
							loadMode(button.dataset.movieMode);
						});
					});

					searchForm.addEventListener("submit", (event) => {
						event.preventDefault();
						search(searchInput.value);
					});

					const originalButtons = Array.from(
						document.querySelectorAll(".tab-button")
					).filter((button) => button !== moviesButton);

					const closeMovies = () => {
						panel.classList.remove("active");
						moviesButton.classList.remove("active");
					};

					for (const button of originalButtons) {
						button.addEventListener("click", closeMovies, true);
					}

					moviesButton.addEventListener("click", () => {
						for (const button of originalButtons) {
							button.classList.remove("active");
						}
						moviesButton.classList.add("active");
						panel.classList.add("active");

						if (!loaded) {
							loaded = true;
							loadMode("trending");
						}
					});

					return true;
				}

				if (!installMoviesTab()) {
					const observer = new MutationObserver(() => {
						if (installMoviesTab()) observer.disconnect();
					});
					observer.observe(document.documentElement, {
						childList: true,
						subtree: true,
					});
				}
			})();
		</script>
	</body>
</html>
